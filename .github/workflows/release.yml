name: Release

on:
  release:
    types: [published]

# Least privilege by default. Only the release job needs write access, to attach
# artifacts to the GitHub Release.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Extract version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set Maven version
        run: |
          mvn --batch-mode versions:set \
              -DnewVersion=${{ steps.version.outputs.version }} \
              -DgenerateBackupPoms=false

      - name: Verify (lint, licence headers, tests)
        run: mvn verify --batch-mode

      - name: Build artifacts
        run: mvn package -DskipTests -Dskip.validation=true --batch-mode

      # Three artifacts, two destinations: the ZIP goes in plugins/, both jars in lib/.
      # See the deployment table in the README.
      - name: Upload artifacts to GitHub Release
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gh release upload ${{ github.event.release.tag_name }} \
            "gravitee-secret-provider-gcp-plugin/target/gravitee-secret-provider-gcp-${VERSION}.zip" \
            "gravitee-secret-provider-gcp-el/target/gravitee-secret-provider-gcp-el-${VERSION}.jar" \
            "gravitee-secret-provider-gcp-core/target/gravitee-secret-provider-gcp-core-${VERSION}.jar" \
            --clobber
